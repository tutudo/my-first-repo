name: CI

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 查看仓库文件
        run: ls -la

      - name: 打印 hello.txt
        run: cat hello.txt
      - name: 检查冲突标记
        run: |
          if grep -rn '<<<<<<<' hello.txt; then
            echo "发现冲突标记！"
            exit 1
          fi
